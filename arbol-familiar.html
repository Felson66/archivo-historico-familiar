<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>Árbol Familiar panorámico · Raíces</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#d8d6cf;color:#20352d;font-family:Arial,sans-serif}.bar{height:38px;background:white;display:flex;align-items:center;gap:18px;padding:0 10px;font-size:13px}.bar b{font-size:15px}.bar #status{margin-left:auto}.sheet{width:2000px;height:720px;margin:12px auto;background:#f7f3e9;position:relative;box-shadow:0 3px 16px #0002;overflow:hidden}.sheet h1{position:absolute;top:8px;left:0;right:0;text-align:center;margin:0;font:700 28px Georgia;color:#18352c}.stage{position:absolute;left:18px;right:18px;top:56px;bottom:18px}.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.card{position:absolute;width:78px;height:44px;border:1.2px solid #9db2aa;border-radius:5px;background:#fffdf8;padding:5px 4px 3px 24px;overflow:hidden}.card.root{border:2px solid #315e50;background:#f1f7f3}.ico{position:absolute;left:5px;top:12px;width:16px;height:16px;border-radius:50%;border:1px solid #b8c6bf;background:#edf1ed;display:grid;place-items:center;font:700 8px Georgia;color:#53675e;overflow:hidden}.ico img{width:100%;height:100%;object-fit:cover}.name{font:700 7.1px/1.03 Georgia;color:#1f3029;max-height:24px;overflow:hidden}.dates{font:5.5px Arial;color:#6d7873;margin-top:2px;white-space:nowrap}.legend{position:absolute;right:10px;bottom:5px;font-size:6px;color:#777}
@media (max-width:768px){
  html,body{overflow-x:hidden;background:#d8d6cf}
  .bar{height:42px;padding:0 8px;gap:6px;font-size:13px;position:relative;z-index:5}
  .bar b{font-size:13px;line-height:1.05;max-width:100px}
  .bar #status{display:none}
  .bar button{display:none}
  .sheet{margin:0!important;box-shadow:none;transform-origin:0 0;will-change:transform}
  #lines path{stroke-width:3.2px!important}
}

</style></head><body><div class="bar"><b>Árbol Familiar · Raíces</b><span id="status"></span><button onclick="print()">Imprimir / Guardar PDF</button></div><div class="sheet"><h1>Árbol Familiar</h1><div class="stage" id="stage"><svg class="lines" id="lines"></svg></div><div class="legend">Raíces · alpha32 · motor V22.1 · impresión 200 × 72 cm</div></div><script>
let A=[];
async function renderPanoramicTree(){
try{
  const response=await fetch('data/personas.json?ts='+Date.now(),{cache:'no-store'});
  if(!response.ok) throw new Error('No se pudo cargar data/personas.json');
  A=await response.json();
const B=Object.fromEntries(A.map(x=>[x.id,x])),ROOT='P0015';
const P=new Map,C=new Map,S=new Map;const add=(m,a,b)=>{if(!a||!b||!B[a]||!B[b])return;if(!m.has(a))m.set(a,new Set);m.get(a).add(b)},vals=(m,k)=>[...(m.get(k)||[])];
for(const x of A){const ps=(x.padres&&x.padres.length)?x.padres:[x.padre,x.madre].filter(Boolean);for(const p of ps){add(P,x.id,p);add(C,p,x.id)}for(const c of (x.hijos||[])){add(C,x.id,c);add(P,c,x.id)}for(const s of (x.conyuges||[])){add(S,x.id,s);add(S,s,x.id)}}
function branch(r){let core=new Set(),q=[r];while(q.length){let x=q.shift();if(!B[x]||core.has(x))continue;core.add(x);q.push(...vals(P,x),...vals(C,x))}let z=new Set(core);for(const x of core)for(const p of vals(P,x))for(const y of vals(C,p))z.add(y);for(const x of [...z])for(const y of vals(S,x))z.add(y);return z}
const Z=branch(ROOT);
// Generaciones derivadas exclusivamente de padre/madre; cónyuges heredan generación.
const G=new Map([[ROOT,0]]),q=[ROOT];while(q.length){const x=q.shift(),g=G.get(x);for(const p of vals(P,x))if(Z.has(p)&&!G.has(p)){G.set(p,g-1);q.push(p)}for(const c of vals(C,x))if(Z.has(c)&&!G.has(c)){G.set(c,g+1);q.push(c)}}let ch=true;while(ch){ch=false;for(const x of Z)if(!G.has(x)){const s=vals(S,x).find(y=>G.has(y));if(s){G.set(x,G.get(s));ch=true}}}for(const x of Z)if(!G.has(x))G.set(x,0);
const minG=Math.min(...G.values()),maxG=Math.max(...G.values()),rows=maxG-minG+1;
const W=1964,H=646,CW=78,CH=44,COUPLEGAP=3,FAMILYGAP=16,ROWPAD=8,pos={};
// Unidad visual: una pareja real es indivisible. Priorizamos la pareja del ROOT explícitamente.
const units=[],unitOf=new Map,byG=new Map;
for(let g=minG;g<=maxG;g++){let ids=[...Z].filter(x=>G.get(x)===g).sort((a,b)=>(B[a].nombre||'').localeCompare(B[b].nombre||'','es')),used=new Set,arr=[];for(const x of ids){if(used.has(x))continue;let mates=vals(S,x).filter(y=>Z.has(y)&&G.get(y)===g&&!used.has(y));if(x===ROOT&&mates.includes('P0027'))mates=['P0027',...mates.filter(y=>y!=='P0027')];let mate=mates[0];let m=mate?[x,mate]:[x];if(m.includes(ROOT))m.sort((a,b)=>a===ROOT?-1:b===ROOT?1:0);let u={id:'U'+units.length,g,m,w:m.length*CW+(m.length-1)*COUPLEGAP,x:0,order:0,parents:new Set,kids:new Set};units.push(u);arr.push(u);for(const id of m){used.add(id);unitOf.set(id,u)}}byG.set(g,arr)}
// Familias: clave EXACTA del conjunto de padres registrado en cada hijo. No se usa conyuge para inventar paternidad.
const families=new Map();for(const c of Z){const ps=vals(P,c).filter(p=>Z.has(p)).sort();if(!ps.length)continue;const key=ps.join('+');if(!families.has(key))families.set(key,{key,parents:ps,children:[]});families.get(key).children.push(c)}
for(const f of families.values()){for(const c of f.children){const cu=unitOf.get(c);for(const p of f.parents){const pu=unitOf.get(p);if(pu&&cu&&pu!==cu){pu.kids.add(cu);cu.parents.add(pu)}}}}
// Orden baricéntrico por unidades, con hermanos (mismos padres exactos) como bloque.
for(const [g,a] of byG)a.forEach((u,i)=>u.order=i);
function parentKey(u){let ks=[];for(const id of u.m){const ps=vals(P,id).filter(x=>Z.has(x)).sort();if(ps.length)ks.push(ps.join('+'))}return ks.sort()[0]||'~'+u.id}
function blockify(arr){const M=new Map;for(const u of arr){const k=parentKey(u);if(!M.has(k))M.set(k,[]);M.get(k).push(u)}return [...M.values()]}
function bary(u,which){const a=[...u[which]];return a.length?a.reduce((s,v)=>s+v.order,0)/a.length:u.order}
for(let pass=0;pass<16;pass++){for(let g=minG+1;g<=maxG;g++){let blocks=blockify(byG.get(g));blocks.sort((a,b)=>Math.min(...a.map(u=>bary(u,'parents')))-Math.min(...b.map(u=>bary(u,'parents'))));let out=blocks.flat();byG.set(g,out);out.forEach((u,i)=>u.order=i)}for(let g=maxG-1;g>=minG;g--){let blocks=blockify(byG.get(g));blocks.sort((a,b)=>Math.min(...a.map(u=>bary(u,'kids')))-Math.min(...b.map(u=>bary(u,'kids'))));let out=blocks.flat();byG.set(g,out);out.forEach((u,i)=>u.order=i)}}
// Colocación: cero solapamientos por construcción. El hueco entre familias es mayor que entre hermanos.
const VSTEP=(H-CH-30)/Math.max(1,rows-1),Y0=10;
for(let g=minG;g<=maxG;g++){const arr=byG.get(g);let widths=arr.reduce((s,u)=>s+u.w,0),gaps=0;for(let i=1;i<arr.length;i++)gaps+=parentKey(arr[i])===parentKey(arr[i-1])?4:FAMILYGAP;let total=widths+gaps;let scale=Math.min(1,(W-2*ROWPAD)/Math.max(1,total));let x=(W-total*scale)/2,y=Y0+(g-minG)*VSTEP;for(let i=0;i<arr.length;i++){let u=arr[i];u.x=x;u.w*=scale;let each=(u.w-(u.m.length-1)*COUPLEGAP)/u.m.length;for(let j=0;j<u.m.length;j++)pos[u.m[j]]={x:x+j*(each+COUPLEGAP),y,w:each};x+=u.w;if(i<arr.length-1)x+=(parentKey(arr[i+1])===parentKey(u)?4:FAMILYGAP)*scale}}
// Suavizado horizontal sin cambiar orden ni permitir solapamientos.
function ucenter(u){let xs=u.m.map(id=>pos[id]);return (Math.min(...xs.map(p=>p.x))+Math.max(...xs.map(p=>p.x+p.w)))/2}
for(let pass=0;pass<6;pass++){for(let g=minG+1;g<=maxG;g++){let arr=byG.get(g);for(let i=0;i<arr.length;i++){let u=arr[i],ps=[...u.parents];if(!ps.length)continue;let target=ps.reduce((s,p)=>s+ucenter(p),0)/ps.length,cur=ucenter(u),dx=(target-cur)*.35;let left=i?Math.max(...arr[i-1].m.map(id=>pos[id].x+pos[id].w))+4:0,right=i<arr.length-1?Math.min(...arr[i+1].m.map(id=>pos[id].x))-4:W;let ux=Math.min(...u.m.map(id=>pos[id].x)),ur=Math.max(...u.m.map(id=>pos[id].x+pos[id].w));dx=Math.max(left-ux,Math.min(right-ur,dx));for(const id of u.m)pos[id].x+=dx}}}
const svg=document.getElementById('lines'),NS='http://www.w3.org/2000/svg';const LINE_COLORS=['#829b92','#718b98','#a27f6d','#9b8d62'];function path(d,w=1,color='#91a79f'){let e=document.createElementNS(NS,'path');e.setAttribute('d',d);e.setAttribute('fill','none');e.setAttribute('stroke',color);e.setAttribute('stroke-width',w);e.setAttribute('stroke-linecap','square');svg.appendChild(e)}
function centerCard(id){const p=pos[id];return p.x+p.w/2}
// Parejas: línea corta únicamente entre sus dos tarjetas.
for(const u of units)if(u.m.length===2){let a=pos[u.m[0]],b=pos[u.m[1]],y=a.y+CH/2;path(`M${a.x+a.w},${y} L${b.x},${y}`,1.2)}
// Cada familia obtiene SU PROPIO conector. Nunca existe una barra generacional global.
const fams=[...families.values()].filter(f=>f.children.some(c=>pos[c])&&f.parents.some(p=>pos[p]));
const slotByGap=new Map;for(const f of fams){const child=f.children.find(c=>pos[c]);if(!child)continue;let pg=Math.min(...f.parents.filter(p=>pos[p]).map(p=>G.get(p))),cg=G.get(child);let k=pg+'>'+cg;if(!slotByGap.has(k))slotByGap.set(k,[]);slotByGap.get(k).push(f)}
for(const [gap,fs] of slotByGap){fs.sort((a,b)=>a.key.localeCompare(b.key));fs.forEach((f,idx)=>{let ps=f.parents.filter(p=>pos[p]),kids=f.children.filter(c=>pos[c]);if(!ps.length||!kids.length)return;let pa=ps.reduce((s,p)=>s+centerCard(p),0)/ps.length;let py=Math.max(...ps.map(p=>pos[p].y+CH));let ky=Math.min(...kids.map(c=>pos[c].y));let bus=py+(ky-py)*(0.30+0.38*((idx%5)/4));let xs=[pa,...kids.map(centerCard)],x1=Math.min(...xs),x2=Math.max(...xs);let color=fs.length>1?LINE_COLORS[idx%LINE_COLORS.length]:'#91a79f';path(`M${pa},${py} L${pa},${bus} M${x1},${bus} L${x2},${bus}`,1.12,color);for(const c of kids){let x=centerCard(c);path(`M${x},${bus} L${x},${pos[c].y}`,1.12,color)}})}
function years(p){let a=p.fecha_nacimiento||p.datos_resumen||'',d=p.fecha_defuncion||'';let ya=(String(a).match(/(?:18|19|20)\d{2}/)||['?'])[0],yd=(String(d).match(/(?:18|19|20)\d{2}/)||[''])[0];return yd?`${ya} – ${yd}`:`${ya} –`}
function validPrincipal(p){let fp=p.fotografia_principal||'';return fp&&(p.fotografias||[]).some(f=>f&&f.src===fp)?fp:''}
const stage=document.getElementById('stage');for(const id of Z){let p=B[id],q=pos[id];if(!q)continue;let e=document.createElement('div');e.className='card'+(id===ROOT?' root':'');e.style.left=q.x+'px';e.style.top=q.y+'px';e.style.width=q.w+'px';e.innerHTML='<div class="ico">♧</div><div class="name"></div><div class="dates"></div>';let ico=e.querySelector('.ico'),fp=validPrincipal(p);if(fp){let im=document.createElement('img');im.src=fp;im.alt='';im.style.objectPosition=p.fotoPosicion||'50% 50%';im.onerror=()=>{im.remove();ico.textContent='♧'};ico.textContent='';ico.appendChild(im)}e.querySelector('.name').textContent=p.nombre||id;e.querySelector('.dates').textContent=years(p);stage.appendChild(e)}
// Auditoría geométrica en ejecución.
let overlaps=[];const ids=[...Z].filter(id=>pos[id]);for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){let a=pos[ids[i]],b=pos[ids[j]];if(a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+CH&&a.y+CH>b.y)overlaps.push([ids[i],ids[j]])}
const mate=vals(S,ROOT).find(x=>Z.has(x));document.getElementById('status').textContent=`${Z.size} personas · ${rows} generaciones · ${families.size} familias · solapamientos: ${overlaps.length} · ${B[ROOT].nombre}${mate?' + '+B[mate].nombre:''}`;
window.__V22_1_AUDIT={people:Z.size,generations:rows,families:families.size,overlaps,rootMate:mate,rootTogether:unitOf.get(ROOT)===unitOf.get('P0027')};

}catch(error){
 console.error(error);
 const s=document.getElementById('status'); if(s)s.textContent='No se pudieron cargar los datos';
 const st=document.getElementById('stage'); if(st)st.innerHTML='<p style="padding:30px;font:16px Arial">No se pudo cargar data/personas.json.</p>';
}
}
function fitMobilePanorama(){
 const sheet=document.querySelector('.sheet'); if(!sheet)return;
 if(window.matchMedia('(max-width:768px)').matches){
   const scale=window.innerWidth/2000; sheet.style.transform=`scale(${scale})`; sheet.style.margin='0';
   const h=42+720*scale; document.body.style.height=h+'px'; document.documentElement.style.height=h+'px'; document.body.style.minHeight='0'; document.body.style.overflowY='hidden';
 }else{sheet.style.transform='';document.body.style.height='';document.documentElement.style.height='';document.body.style.minHeight='';document.body.style.overflowY='';}
}
window.addEventListener('resize',fitMobilePanorama,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(fitMobilePanorama,100),{passive:true});
renderPanoramicTree().then(fitMobilePanorama);
</script></body></html>
