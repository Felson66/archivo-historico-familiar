let A=[],B={},P=new Map(),C=new Map(),S=new Map(),Z=new Set(),G=new Map(),pos={},scale=1,selected=[];const CESAR_VIEW=new URLSearchParams(location.search).get('vista')==='cesar';const ROOT=CESAR_VIEW?'P00149':'P0015',CW=176,CH=84,GAP=20,FAMILYGAP=70,ROWGAP=190,PAD=100;

function layout(){

 // alpha43: optimizador explícito de cruces. Mueve UNIDADES familiares completas, nunca personas.
 // Penaliza con mucha fuerza los cruces y, a igualdad, la longitud horizontal de las conexiones.
 function edgeList(){let e=[];for(let g=min+1;g<=max;g++)for(const u of rows.get(g))for(const p of parentUnits(u))e.push([p,u]);return e}

   const us=rows.get(g);
   for(let i=0;i<us.length-1;i++){

    [us[i],us[i+1]]=[us[i+1],us[i]];us.forEach((u,k)=>u.order=k);
    const s=objective();
    if(s<best){best=s;improved=true}
    else{[us[i],us[i+1]]=[us[i+1],us[i]];us.forEach((u,k)=>u.order=k)}

 // Empaquetado compacto: cada fila usa únicamente el ancho real de sus tarjetas.
 const rowWidth=new Map();

   let dif=[];for(const u of rows.get(g)){let ps=parentUnits(u);if(ps.length){let pc=ps.reduce((s,p)=>s+p.local+offsets.get(g-1),0)/ps.length;dif.push(pc-(u.local+offsets.get(g)))}}

function parentKey(id){let ps=vals(P,id).filter(x=>Z.has(x)).sort();return ps.length?ps.join('+'):'~'+id}

function pathEl(svg,d,cls){let e=document.createElementNS('http://www.w3.org/2000/svg','path');e.setAttribute('d',d);e.setAttribute('class',cls);svg.appendChild(e)}

function drawBase(){
 const svg=document.getElementById('lines');svg.innerHTML='';
 // MOTOR V2: las líneas nacen siempre de una familia concreta.
 // No hay barras horizontales compartidas ni carriles por generación.
 for(const id of Z)for(const s of vals(S,id))if(Z.has(s)&&id<s&&pos[id]&&pos[s]){
   let a=center(id),b=center(s);
   // Conectar los bordes de las tarjetas, no sus centros ocultos.
   const left=pos[id].x<=pos[s].x?id:s,right=left===id?s:id;
   const x1=pos[left].x+CW,x2=pos[right].x,y=pos[left].y+CH/2;

   if(!pos[child])continue;
   const ps=vals(P,child).filter(p=>Z.has(p)&&pos[p]).sort();
   if(!ps.length)continue;
   const key=ps.join('+');
   if(!fam.has(key))fam.set(key,{ps:[...ps],kids:[]});

   f.kids.sort((a,b)=>center(a).x-center(b).x);

   const px=f.ps.reduce((s,p)=>s+center(p).x,0)/f.ps.length;
   const py=Math.max(...f.ps.map(p=>pos[p].y+CH));
   const jy=py+18;

   circleEl(svg,px,jy,3.5,'family-junction');

   // Las curvas se abren enseguida desde la familia y terminan verticales sobre el hijo.

function neighbors(id){return [...new Set([...vals(P,id),...vals(C,id),...vals(S,id)].filter(x=>Z.has(x)))]}

function restoreOrFocus(){const qs=new URLSearchParams(location.search),id=qs.get('persona'),key='raicesFullTreeState'+(CESAR_VIEW?'Cesar':'');if(qs.get('restaurar')==='1'){try{const state=JSON.parse(sessionStorage.getItem(key)||'null');if(state){setScale(state.scale);selected=(state.selected||[]).filter(x=>Z.has(x)).slice(0,2);updateRoute();updateProfileButton();const v=document.getElementById('viewport');v.scrollLeft=state.left;v.scrollTop=state.top;sessionStorage.removeItem(key);return}}catch(_){}}if(id&&Z.has(id)){selected=[id];updateRoute();updateProfileButton();centerOn(id)}else centerOn(ROOT)}
document.getElementById('openProfile').onclick=()=>{if(selected.length)openProfile(selected[selected.length-1])};
// Cadena de apellidos por generaciones, mostrando solo posiciones con datos útiles.
// Se respetan las personas visibles en cada versión del árbol.
function surnameParts(person){
  const raw=String(person?.nombre||'').trim().replace(/\s+\d+[ºª]\s*$/u,'');
  const tokens=raw.split(/\s+/).filter(Boolean);
  if(tokens.length<3)return [];
  const take=end=>{
    let start=end-1;
    while(start>0&&/^(?:de|del|la|las|los|y|da|do)$/i.test(tokens[start-1]))start--;
    return {value:tokens.slice(start,end).join(' '),start};
  };
  const second=take(tokens.length),first=take(second.start);
  return first.start>=1?[first.value,second.value]:[];
}
function parentPair(id){
  const p=B[id];if(!p)return [null,null];
  const explicit=[p.padre,p.madre].map(x=>x&&B[x]&&Z.has(x)?x:null);
  if(explicit.some(Boolean))return explicit;
  const legacy=Array.isArray(p.padres)?p.padres.filter(x=>B[x]&&Z.has(x)):[...vals(P,id)].filter(x=>Z.has(x));
  const male=x=>/^(?:hombre|masculino|m)$/i.test(String(B[x].sexo||''));
  const female=x=>/^(?:mujer|femenino|f)$/i.test(String(B[x].sexo||''));
  return [legacy.find(male)||null,legacy.find(female)||null];
}
function surnameGenerations(id){
  const own=surnameParts(B[id]);let row=[id],out=[];
  for(let depth=1;depth<=6;depth++){
    const next=[];
    for(const ancestor of row)next.push(...(ancestor?parentPair(ancestor):[null,null]));
    const names=next.map((ancestor,i)=>ancestor?(surnameParts(B[ancestor])[0]||null):(depth===1?own[i]||null:null));
    if(!names.some(Boolean))break;
    out.push({depth,names});
    if(!next.some(Boolean))break;
    row=next;
  }
  return out;
}
function showSurnames(id){
  if(!B[id]||!Z.has(id))return;
  const escapeText=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const person=B[id], own=surnameParts(person), tokens=String(person.nombre||'').trim().split(/\s+/);
  const given=tokens.slice(0,Math.max(1,tokens.length-own.reduce((n,x)=>n+x.split(/\s+/).length,0))).join(' ');
  const generations=surnameGenerations(id);
  // Mostrar una sola cadena ordenada: nombre, sus dos apellidos y después los apellidos conocidos de sus antepasados.
  // No repetir los dos apellidos propios cuando vuelven a aparecer en la primera generación de ascendientes.
  // Recorrer los antepasados en orden genealógico, sin volver a mostrar
  // apellidos ya encontrados en generaciones anteriores.
  const entries=[],seen=new Set();
  const key=v=>String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').replace(/\s+/g,' ').trim();
  const append=name=>{if(!name)return;const k=key(name);if(!seen.has(k)){seen.add(k);entries.push(name)}};
  own.forEach(append);
  // La primera generación representa los apellidos propios y se omite.
  // Cada generación posterior contiene los primeros apellidos de sus antepasados.
  // No generar casillas vacías por ramas que terminan: solo una marca por
  // tramo desconocido entre apellidos conocidos de la misma generación.
  for(const gen of generations){
    if(gen.depth===1||entries.length>=30)continue;
    const names=gen.names;
    const novel=names.map(name=>name&&!seen.has(key(name))?name:null);
    const first=novel.findIndex(Boolean),last=novel.findLastIndex(Boolean);
    if(first<0)continue;
    let gap=false;
    for(let i=first;i<=last&&entries.length<30;i++){
      if(novel[i]){if(gap){entries.push('XXXXX');gap=false}append(novel[i])}
      else if(!names[i])gap=true;
    }
  }
  const items=entries.map((name,i)=>'<span class="surname-item">'+(i+1)+'. '+escapeText(name)+'</span>').join('');
  document.getElementById('surnameResult').innerHTML='<p><strong>'+escapeText(given)+'</strong></p>'+ 
    '<div class="surname-items surname-linear">'+items+'</div>'+ 
    '<p class="surname-note">Apellidos distintos identificados en orden de ascendencia. XXXXX indica un tramo sin datos entre apellidos conocidos. La interpretación de apellidos compuestos requiere revisión.</p>';
  document.getElementById('surnameOverlay').classList.add('visible');
}
document.getElementById('closeSurnames').onclick=()=>document.getElementById('surnameOverlay').classList.remove('visible');
document.getElementById('surnameOverlay').addEventListener('click',e=>{if(e.target.id==='surnameOverlay')e.currentTarget.classList.remove('visible')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('surnameOverlay').classList.remove('visible')});

function showRelation(message,route){
 document.getElementById('kinship').textContent=message;
 const toggle=document.getElementById('togglePath'),full=document.getElementById('fullPath');
 full.hidden=true;toggle.setAttribute('aria-expanded','false');toggle.textContent='Ver recorrido completo ▾';
 if(route&&route.length){full.textContent=route.map(id=>B[id].nombre).join(' → ');toggle.hidden=false}else{toggle.hidden=true;full.textContent=''}
 updateHeaderHeight();
}
function ancestors(id){let q=[[id,0]],dist=new Map();while(q.length){let [x,d]=q.shift();if(dist.has(x)&&dist.get(x)<=d)continue;dist.set(x,d);for(const p of vals(P,x))q.push([p,d+1])}return dist}
function kinship(a,b){
 if(a===b)return 'Es la misma persona.';
 const aa=ancestors(a),bb=ancestors(b);
 if(aa.has(b))return `${B[b].nombre} es ${generationTerm(aa.get(b),'asc')} de ${B[a].nombre}.`;
 if(bb.has(a))return `${B[b].nombre} es ${generationTerm(bb.get(a),'desc')} de ${B[a].nombre}.`;
 let shared=[...aa.keys()].filter(x=>bb.has(x)&&aa.get(x)>0&&bb.get(x)>0);
 if(shared.length){shared.sort((x,y)=>Math.max(aa.get(x),bb.get(x))-Math.max(aa.get(y),bb.get(y)) || aa.get(x)+bb.get(x)-aa.get(y)-bb.get(y));
 let d1=aa.get(shared[0]),d2=bb.get(shared[0]);
 if(d1===1&&d2===1)return 'Hermanos (comparten al menos un progenitor).';
 if(d1===1)return `Tío/a y sobrino/a, con ${d2-2} generación(es) adicionales de distancia.`;
 if(d2===1)return `Sobrino/a y tío/a, con ${d1-2} generación(es) adicionales de distancia.`;
 const degree=Math.min(d1,d2)-1;let name=degree===1?'Primos hermanos':degree===2?'Primos segundos':degree===3?'Primos terceros':`Primos de ${degree}.º grado`;
 const delta=Math.abs(d1-d2);return name+(delta?` con ${delta} generación(es) de diferencia.`:'.');
 }
 return 'Conexión familiar registrada; no se ha identificado un antepasado común. Puede ser por matrimonio.';
}
function generationTerm(n,dir){const a=dir==='asc'?['','padre/madre','abuelo/a','bisabuelo/a','tatarabuelo/a']:['','hijo/a','nieto/a','bisnieto/a','tataranieto/a'];return a[n]||`${n} generaciones ${dir==='asc'?'ascendiente':'descendiente'}`}
function updateRoute(){
 document.querySelectorAll('.card').forEach(e=>e.classList.remove('selected','onroute','dim'));selected.forEach(id=>document.querySelector(`.card[data-id="${id}"]`)?.classList.add('selected'));
 let svg=document.getElementById('routeLines');svg.innerHTML='';
 if(selected.length<2){showRelation(selected.length?`${B[selected[0]].nombre}: selecciona otra persona.`:'Selecciona dos personas para ver cómo se conectan.');return}
 let route=shortest(selected[0],selected[1]);if(!route.length){showRelation('No se ha encontrado conexión registrada.');return}
 // Si el camino usa una relación padre/madre-hijo, mostramos la pareja completa de progenitores.
 let shown=new Set(route);
 for(let i=0;i<route.length-1;i++){
  let a=route[i],b=route[i+1],child=null;
  if(vals(P,b).includes(a))child=b;else if(vals(P,a).includes(b))child=a;
  if(child)for(const p of vals(P,child))if(Z.has(p))shown.add(p);
 }
 document.querySelectorAll('.card').forEach(e=>{if(shown.has(e.dataset.id))e.classList.add('onroute');else e.classList.add('dim')});
 // Resalta las conexiones reales del recorrido y las parejas de progenitores añadidas.
 for(let i=0;i<route.length-1;i++){let a=center(route[i]),b=center(route[i+1]),mid=(a.y+b.y)/2;pathEl(svg,`M${a.x},${a.y} L${a.x},${mid} L${b.x},${mid} L${b.x},${b.y}`,'route-line')}
 for(const id of shown)for(const mate of vals(S,id))if(shown.has(mate)&&id<mate&&pos[id]&&pos[mate]){let a=center(id),b=center(mate);pathEl(svg,`M${a.x},${a.y} L${b.x},${b.y}`,'route-line')}
 showRelation(kinship(selected[0],selected[1]),route);
}
function updateHeaderHeight(){const h=document.querySelector('.top').offsetHeight+document.getElementById('relationship').offsetHeight;document.documentElement.style.setProperty('--header-height',h+'px')}
window.addEventListener('resize',updateHeaderHeight);
document.getElementById('togglePath').onclick=()=>{const p=document.getElementById('fullPath'),b=document.getElementById('togglePath');p.hidden=!p.hidden;b.textContent=p.hidden?'Ver recorrido completo ▾':'Ocultar recorrido ▴';b.setAttribute('aria-expanded',String(!p.hidden));updateHeaderHeight()};
function applyScale(){let canvas=document.getElementById('canvas'),stage=document.getElementById('stage');stage.style.transform=`scale(${scale})`;stage.style.transformOrigin='0 0';canvas.style.width=Math.max(innerWidth,treeW*scale)+'px';canvas.style.height=Math.max(document.getElementById('viewport').clientHeight,treeH*scale)+'px'}
function setScale(v){scale=Math.max(.3,Math.min(1.8,v));applyScale()}
function centerOn(id){let v=document.getElementById('viewport'),p=center(id);v.scrollLeft=Math.max(0,p.x*scale-v.clientWidth/2);v.scrollTop=Math.max(0,p.y*scale-v.clientHeight/2)}
document.getElementById('plus').onclick=()=>setScale(scale+.15);document.getElementById('minus').onclick=()=>setScale(scale-.15);document.getElementById('center').onclick=()=>centerOn(selected[0]||ROOT);document.getElementById('fit').onclick=()=>{let v=document.getElementById('viewport');setScale(Math.min(v.clientWidth/treeW,v.clientHeight/treeH,.9));v.scrollTo(0,0)};document.getElementById('clear').onclick=()=>{selected=[];updateRoute();updateProfileButton()};document.getElementById('viewport').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setScale(scale+(e.deltaY<0?.1:-.1))}},{passive:false});
// Zoom táctil centrado en el punto medio de los dedos.
const viewport=document.getElementById('viewport');let pinch=null;
function touchDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
viewport.addEventListener('touchstart',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1],rect=viewport.getBoundingClientRect();const x=(a.clientX+b.clientX)/2-rect.left,y=(a.clientY+b.clientY)/2-rect.top;pinch={distance:touchDistance(a,b),scale,worldX:(viewport.scrollLeft+x)/scale,worldY:(viewport.scrollTop+y)/scale};}},{passive:true});
viewport.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){e.preventDefault();const a=e.touches[0],b=e.touches[1],rect=viewport.getBoundingClientRect();const x=(a.clientX+b.clientX)/2-rect.left,y=(a.clientY+b.clientY)/2-rect.top;setScale(pinch.scale*touchDistance(a,b)/pinch.distance);viewport.scrollLeft=pinch.worldX*scale-x;viewport.scrollTop=pinch.worldY*scale-y;}},{passive:false});
viewport.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null},{passive:true});
updateHeaderHeight();
fetch('data/personas.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{A=x;compute()}).catch(()=>{showRelation('No se pudieron cargar los datos.')});
</script></body></html>
